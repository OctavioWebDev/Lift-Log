<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <path id="topArc" d="M 160,500 A 340,340 0 0 1 840,500" fill="none" />
    <path id="bottomArc" d="M 840,520 A 340,340 0 0 1 160,520" fill="none" />
  </defs>

  <!-- Background -->
  <circle cx="500" cy="500" r="490" fill="#000000" />
  <circle cx="500" cy="500" r="470" fill="none" stroke="#EAB308" stroke-width="4" />

  <!-- Circular text -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="88" fill="#EAB308" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">CHI RHO</textPath>
  </text>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="100" fill="#EAB308" letter-spacing="10">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">LIFTS</textPath>
  </text>

  <!-- Chi-Rho monogram -->
  <g stroke="#EAB308" stroke-width="26" stroke-linecap="square">
    <!-- Crossed diagonal bars (Chi) -->
    <line x1="350" y1="380" x2="650" y2="620" />
    <line x1="650" y1="380" x2="350" y2="620" />
    <!-- Vertical bar + cross arm (Rho stem doubling as a cross) -->
    <line x1="500" y1="330" x2="500" y2="720" />
    <line x1="455" y1="670" x2="545" y2="670" />
  </g>
  <!-- Rho bowl (P) -->
  <path d="M 500,330 h 55 a 62,62 0 0 1 0,124 h -55" fill="none" stroke="#EAB308" stroke-width="26" stroke-linecap="square" stroke-linejoin="round" />

  <!-- Alpha / Omega -->
  <text x="300" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#EAB308" text-anchor="middle">&#945;</text>
  <text x="700" y="520" font-family="Georgia, 'Times New Roman', serif" font-size="70" fill="#EAB308" text-anchor="middle">&#937;</text>
</svg>
